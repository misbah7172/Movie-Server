version: "3.8"

services:
  cinestream:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinestream-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
